name: PureStack Technical Audit
# Se ejecuta cuando alguien hace push o abre un Pull Request
on: [push, pull_request]

jobs:
  audit-code:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Descargar el código del candidato
    - uses: actions/checkout@v3

    # 2. Configurar Python
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. INSTALAR DEPENDENCIAS (El paso crítico modificado)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalamos nuestras herramientas de auditoría + librerías de IA necesarias para el test
        pip install pytest flake8 langchain chromadb openai tiktoken sentence-transformers
        # Si el candidato tiene un requirements.txt, lo instalamos también
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Linter (Limpieza de código)
    - name: Lint (Clean Code)
      # Esto busca errores de sintaxis graves (E9, F63, etc.)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. Ejecutar los Tests
    - name: Run Tests
      id: run_tests
      # Ejecuta pytest y busca tests en la carpeta "tests/" o archivos que empiecen por "test_"
      run: pytest --verbose
      continue-on-error: true

    # 6. Veredicto Final
    - name: Verdict
      run: |
        if [ ${{ steps.run_tests.outcome }} == 'success' ]; then
          echo "✅ PURESTACK AUDIT: PASSED (CODE AUDITED)."
        else
          echo "❌ FAILED. The code did not pass the technical validation."
          exit 1
        fi
